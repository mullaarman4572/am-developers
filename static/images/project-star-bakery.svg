<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#31103f"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Browser Chrome Header -->
  <rect width="600" height="36" rx="16" fill="#0f172a"/>
  <rect y="20" width="600" height="16" fill="#0f172a"/>
  <circle cx="24" cy="18" r="5" fill="#ef4444"/>
  <circle cx="40" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="18" r="5" fill="#10b981"/>
  <rect x="180" y="8" width="240" height="20" rx="10" fill="#1e293b"/>
  <text x="300" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">starbakery.com/order-online</text>

  <!-- Showcase Content -->
  <!-- Top brand bar -->
  <text x="35" y="72" fill="#fef08a" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900">🎂 Star Bakery &amp; Cafe</text>
  <rect x="450" y="55" width="115" height="26" rx="13" fill="#25D366"/>
  <text x="507" y="72" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">WhatsApp Order</text>

  <!-- Bakery Cards Grid -->
  <!-- Product 1 -->
  <g transform="translate(35, 95)">
    <rect width="165" height="195" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="10" y="10" width="145" height="95" rx="8" fill="#3b0764"/>
    <circle cx="82" cy="55" r="30" fill="url(#goldAccent)" opacity="0.3"/>
    <text x="82" y="62" font-size="34" text-anchor="middle">🍫</text>
    <text x="14" y="125" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Belgian Truffle Cake</text>
    <text x="14" y="142" fill="#94a3b8" font-family="sans-serif" font-size="10">Pure Dutch Chocolate</text>
    <text x="14" y="168" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">₹649</text>
    <rect x="95" y="152" width="60" height="24" rx="6" fill="url(#cyanPurple)"/>
    <text x="125" y="167" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Add +</text>
  </g>

  <!-- Product 2 -->
  <g transform="translate(217, 95)">
    <rect width="165" height="195" rx="12" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5"/>
    <rect x="10" y="10" width="145" height="95" rx="8" fill="#4c0519"/>
    <circle cx="82" cy="55" r="30" fill="#f43f5e" opacity="0.3"/>
    <text x="82" y="62" font-size="34" text-anchor="middle">🍓</text>
    <text x="14" y="125" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Red Velvet Pastry</text>
    <text x="14" y="142" fill="#94a3b8" font-family="sans-serif" font-size="10">Cream Cheese Frosting</text>
    <text x="14" y="168" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">₹499</text>
    <rect x="95" y="152" width="60" height="24" rx="6" fill="url(#cyanPurple)"/>
    <text x="125" y="167" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Add +</text>
  </g>

  <!-- Product 3 -->
  <g transform="translate(400, 95)">
    <rect width="165" height="195" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="10" y="10" width="145" height="95" rx="8" fill="#14532d"/>
    <circle cx="82" cy="55" r="30" fill="#22c55e" opacity="0.3"/>
    <text x="82" y="62" font-size="34" text-anchor="middle">🥐</text>
    <text x="14" y="125" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Butter Croissant Box</text>
    <text x="14" y="142" fill="#94a3b8" font-family="sans-serif" font-size="10">Pack of 4 Fresh Baked</text>
    <text x="14" y="168" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">₹299</text>
    <rect x="95" y="152" width="60" height="24" rx="6" fill="url(#cyanPurple)"/>
    <text x="125" y="167" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Add +</text>
  </g>

  <!-- Bottom Stats bar -->
  <rect x="35" y="308" width="530" height="48" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="55" y="337" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">● WhatsApp 1-Click Checkout</text>
  <text x="240" y="337" fill="#cbd5e1" font-family="sans-serif" font-size="11">⚡ 99/100 Mobile Speed</text>
  <text x="410" y="337" fill="#f59e0b" font-family="sans-serif" font-size="11">★ 4.9 Star Customer Rating</text>
</svg>
