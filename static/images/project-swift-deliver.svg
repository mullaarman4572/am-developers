<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="swiftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#swiftBg)"/>
  
  <rect width="600" height="36" rx="16" fill="#0f172a"/>
  <rect y="20" width="600" height="16" fill="#0f172a"/>
  <circle cx="24" cy="18" r="5" fill="#ef4444"/>
  <circle cx="40" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="18" r="5" fill="#10b981"/>
  <rect x="180" y="8" width="240" height="20" rx="10" fill="#1e293b"/>
  <text x="300" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">swiftdeliver.logistics/portal</text>

  <g transform="translate(40, 60)">
    <rect width="520" height="110" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="25" y="35" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">EXPRESS FREIGHT &amp; PARCEL DISPATCH</text>
    <text x="25" y="68" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900">SwiftDeliver Web Portal</text>
    <text x="25" y="92" fill="#94a3b8" font-family="sans-serif" font-size="11">Real-time GPS tracking • Automated Dispatch • Instant Rate Calculator</text>
  </g>

  <!-- Live Tracking Timeline Bar -->
  <g transform="translate(40, 195)">
    <rect width="520" height="145" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <text x="25" y="32" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Active Shipment #SD-984210</text>
    <text x="440" y="32" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">IN TRANSIT</text>

    <!-- Progress Line -->
    <line x1="40" y1="75" x2="480" y2="75" stroke="#334155" stroke-width="4"/>
    <line x1="40" y1="75" x2="330" y2="75" stroke="#06b6d4" stroke-width="4"/>

    <!-- Nodes -->
    <circle cx="40" cy="75" r="10" fill="#10b981"/>
    <text x="40" y="105" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Booked</text>

    <circle cx="185" cy="75" r="10" fill="#10b981"/>
    <text x="185" y="105" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Dispatched</text>

    <circle cx="330" cy="75" r="10" fill="#06b6d4"/>
    <text x="330" y="105" fill="#06b6d4" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Out for Delivery</text>

    <circle cx="480" cy="75" r="10" fill="#334155"/>
    <text x="480" y="105" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Delivered</text>
  </g>
</svg>
