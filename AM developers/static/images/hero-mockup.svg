<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanPurpleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Background Glows -->
  <ellipse cx="420" cy="280" rx="340" ry="220" fill="url(#bgGlow)" filter="url(#neonBlur)"/>
  <ellipse cx="720" cy="380" rx="180" ry="160" fill="#7928ca" opacity="0.18" filter="url(#neonBlur)"/>

  <!-- ==================== LAPTOP MOCKUP ==================== -->
  <g transform="translate(60, 50)" filter="url(#softShadow)">
    <!-- Laptop Display Lid Outer -->
    <rect x="50" y="30" width="620" height="390" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Screen Bezel -->
    <rect x="62" y="42" width="596" height="366" rx="8" fill="#090d16" />
    
    <!-- Camera Dot -->
    <circle cx="360" cy="36" r="3" fill="#475569"/>

    <!-- Screen Inner Content -->
    <g transform="translate(64, 44)">
      <rect width="592" height="362" rx="6" fill="url(#screenGrad)"/>
      
      <!-- Browser Top bar -->
      <rect width="592" height="32" fill="#0f172a" />
      <circle cx="20" cy="16" r="4.5" fill="#ef4444"/>
      <circle cx="36" cy="16" r="4.5" fill="#eab308"/>
      <circle cx="52" cy="16" r="4.5" fill="#10b981"/>
      <!-- Address pill -->
      <rect x="180" y="7" width="232" height="18" rx="9" fill="#1e293b"/>
      <text x="210" y="20" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">https://amdevelopers.in</text>
      <!-- Green secure lock -->
      <circle cx="198" cy="16" r="3" fill="#10b981"/>

      <!-- Webpage Header -->
      <rect x="25" y="48" width="85" height="14" rx="4" fill="url(#cyanPurpleBar)"/>
      <rect x="360" y="52" width="45" height="8" rx="4" fill="#64748b"/>
      <rect x="420" y="52" width="45" height="8" rx="4" fill="#64748b"/>
      <rect x="480" y="52" width="45" height="8" rx="4" fill="#64748b"/>
      <rect x="540" y="49" width="35" height="14" rx="7" fill="#00f2fe"/>

      <!-- Webpage Hero Banner -->
      <rect x="25" y="80" width="280" height="20" rx="5" fill="#ffffff" opacity="0.95"/>
      <rect x="25" y="108" width="220" height="16" rx="4" fill="url(#cyanPurpleBar)"/>
      <rect x="25" y="134" width="250" height="8" rx="4" fill="#64748b"/>
      <rect x="25" y="148" width="200" height="8" rx="4" fill="#64748b"/>
      
      <!-- CTA Buttons in screen -->
      <rect x="25" y="170" width="80" height="24" rx="12" fill="url(#cyanPurpleBar)"/>
      <rect x="115" y="170" width="80" height="24" rx="12" fill="none" stroke="#64748b" stroke-width="1.5"/>

      <!-- Analytics Dashboard Card Inside Screen -->
      <g transform="translate(320, 80)">
        <rect width="250" height="160" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="18" y="28" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">Live Traffic & Growth</text>
        <text x="18" y="54" fill="#00f2fe" font-family="sans-serif" font-size="20" font-weight="900">+284%</text>
        <text x="95" y="54" fill="#10b981" font-family="sans-serif" font-size="11">▲ Conversions</text>
        <!-- Chart Bars -->
        <rect x="18" y="125" width="16" height="35" rx="3" fill="#334155"/>
        <rect x="44" y="105" width="16" height="55" rx="3" fill="#334155"/>
        <rect x="70" y="90" width="16" height="70" rx="3" fill="#6366f1"/>
        <rect x="96" y="80" width="16" height="80" rx="3" fill="#8b5cf6"/>
        <rect x="122" y="65" width="16" height="95" rx="3" fill="#a855f7"/>
        <rect x="148" y="50" width="16" height="110" rx="3" fill="#00f2fe"/>
        <rect x="174" y="35" width="16" height="125" rx="3" fill="url(#cyanPurpleBar)"/>
        <rect x="200" y="25" width="16" height="135" rx="3" fill="#00f2fe"/>
      </g>

      <!-- 3 Service Feature Mini Cards Inside Screen -->
      <g transform="translate(25, 215)">
        <!-- Card 1 -->
        <rect x="0" y="0" width="170" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
        <circle cx="25" cy="25" r="12" fill="#00f2fe" opacity="0.2"/>
        <text x="25" y="29" fill="#00f2fe" font-size="12" text-anchor="middle">⚡</text>
        <text x="15" y="55" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Blazing Fast Speed</text>
        <rect x="15" y="68" width="140" height="5" rx="2" fill="#475569"/>
        <rect x="15" y="80" width="110" height="5" rx="2" fill="#475569"/>
        <rect x="15" y="96" width="60" height="12" rx="4" fill="#0284c7" opacity="0.4"/>

        <!-- Card 2 -->
        <rect x="185" y="0" width="170" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
        <circle cx="210" cy="25" r="12" fill="#8b5cf6" opacity="0.2"/>
        <text x="210" y="29" fill="#c084fc" font-size="12" text-anchor="middle">📱</text>
        <text x="200" y="55" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Mobile Responsive</text>
        <rect x="200" y="68" width="140" height="5" rx="2" fill="#475569"/>
        <rect x="200" y="80" width="120" height="5" rx="2" fill="#475569"/>
        <rect x="200" y="96" width="60" height="12" rx="4" fill="#7c3aed" opacity="0.4"/>

        <!-- Card 3 -->
        <rect x="370" y="0" width="175" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
        <circle cx="395" cy="25" r="12" fill="#10b981" opacity="0.2"/>
        <text x="395" y="29" fill="#34d399" font-size="12" text-anchor="middle">💬</text>
        <text x="385" y="55" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">WhatsApp Sync</text>
        <rect x="385" y="68" width="140" height="5" rx="2" fill="#475569"/>
        <rect x="385" y="80" width="105" height="5" rx="2" fill="#475569"/>
        <rect x="385" y="96" width="60" height="12" rx="4" fill="#059669" opacity="0.4"/>
      </g>
    </g>

    <!-- Laptop Base / Keyboard deck -->
    <path d="M 0 420 L 720 420 L 670 440 L 50 440 Z" fill="#334155"/>
    <rect x="310" y="420" width="100" height="7" rx="3" fill="#1e293b"/>
    <ellipse cx="360" cy="442" rx="300" ry="5" fill="#000000" opacity="0.4"/>
  </g>

  <!-- ==================== MOBILE PHONE MOCKUP ==================== -->
  <g transform="translate(630, 160)" filter="url(#softShadow)">
    <!-- Phone Outer Case -->
    <rect x="0" y="0" width="220" height="420" rx="34" fill="#0f172a" stroke="url(#cyanPurpleBar)" stroke-width="3"/>
    
    <!-- Phone Screen -->
    <rect x="8" y="8" width="204" height="404" rx="28" fill="#090d16"/>

    <!-- Dynamic Island / Speaker Notch -->
    <rect x="75" y="16" width="70" height="16" rx="8" fill="#000000"/>
    <circle cx="130" cy="24" r="3" fill="#1e293b"/>

    <!-- Screen Content -->
    <g transform="translate(18, 44)">
      <!-- Mini Header with Logo -->
      <rect x="0" y="0" width="50" height="10" rx="3" fill="url(#cyanPurpleBar)"/>
      <circle cx="170" cy="5" r="8" fill="#1e293b"/>
      <!-- Menu lines -->
      <line x1="165" y1="3" x2="175" y2="3" stroke="#00f2fe" stroke-width="1.5"/>
      <line x1="165" y1="7" x2="175" y2="7" stroke="#00f2fe" stroke-width="1.5"/>

      <!-- Mobile Hero -->
      <rect x="0" y="22" width="160" height="14" rx="4" fill="#ffffff"/>
      <rect x="0" y="40" width="130" height="12" rx="3" fill="url(#cyanPurpleBar)"/>
      <text x="0" y="66" fill="#94a3b8" font-family="sans-serif" font-size="8">Affordable Web Development</text>
      <text x="0" y="78" fill="#00f2fe" font-family="sans-serif" font-size="9" font-weight="bold">Starting ₹2,999 Only</text>

      <!-- Instant WhatsApp Inquiry Button on Phone -->
      <rect x="0" y="92" width="184" height="32" rx="8" fill="#25D366"/>
      <text x="92" y="112" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">💬 Chat on WhatsApp</text>

      <!-- Phone Project Card (Star Bakery) -->
      <rect x="0" y="136" width="184" height="105" rx="10" fill="#1e293b" stroke="#334155"/>
      <rect x="8" y="144" width="168" height="48" rx="6" fill="#0f172a"/>
      <text x="92" y="172" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🎂 Star Bakery</text>
      <text x="8" y="206" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="bold">Online Cake Store</text>
      <text x="8" y="218" fill="#00f2fe" font-family="sans-serif" font-size="8">View Live Demo →</text>
      <rect x="130" y="208" width="45" height="16" rx="8" fill="#8b5cf6"/>
      <text x="152" y="219" fill="#ffffff" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">E-COMMERCE</text>

      <!-- Phone Cost Calculator Snippet -->
      <rect x="0" y="250" width="184" height="90" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="10" y="268" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold">Cost Calculator</text>
      <rect x="10" y="278" width="164" height="18" rx="4" fill="#0f172a"/>
      <text x="18" y="290" fill="#cbd5e1" font-family="sans-serif" font-size="8">Business Website (₹2,999)</text>
      <!-- Total Price Display -->
      <text x="10" y="316" fill="#94a3b8" font-family="sans-serif" font-size="8">Estimated Total:</text>
      <text x="80" y="318" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="900">₹2,999</text>
      <rect x="120" y="306" width="54" height="18" rx="9" fill="url(#cyanPurpleBar)"/>
      <text x="147" y="318" fill="#ffffff" font-family="sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Order Now</text>
    </g>
  </g>

  <!-- Floating Badge: Fast 3-5 Days Delivery -->
  <g transform="translate(40, 390)" filter="url(#softShadow)">
    <rect width="180" height="50" rx="12" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5"/>
    <circle cx="28" cy="25" r="14" fill="#00f2fe" opacity="0.2"/>
    <text x="28" y="30" fill="#00f2fe" font-size="14" text-anchor="middle">🚀</text>
    <text x="52" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Superfast Delivery</text>
    <text x="52" y="38" fill="#94a3b8" font-family="sans-serif" font-size="10">Ready in 3 to 5 Days</text>
  </g>

  <!-- Floating Badge: Dual Contact Numbers -->
  <g transform="translate(480, 20)" filter="url(#softShadow)">
    <rect width="210" height="48" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="26" cy="24" r="14" fill="#8b5cf6" opacity="0.2"/>
    <text x="26" y="29" fill="#c084fc" font-size="14" text-anchor="middle">📞</text>
    <text x="48" y="20" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="bold">Direct Founder Support</text>
    <text x="48" y="36" fill="#38bdf8" font-family="sans-serif" font-size="10">8971987220 / 7821964008</text>
  </g>
</svg>
