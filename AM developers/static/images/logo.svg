<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Icon Symbol -->
  <g transform="translate(10, 10)">
    <!-- Hex / Rounded Cube Container -->
    <rect x="5" y="5" width="60" height="60" rx="16" fill="#0f172a" stroke="url(#cyanPurple)" stroke-width="2.5" />
    <!-- Glowing background accent -->
    <circle cx="35" cy="35" r="18" fill="url(#cyanPurple)" opacity="0.15" filter="url(#glow)"/>
    
    <!-- Code bracket left '<' -->
    <path d="M 22 26 L 16 35 L 22 44" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- AM Monogram in center -->
    <path d="M 27 45 L 32 23 L 37 45 M 28.5 38 L 35.5 38" fill="none" stroke="url(#cyanPurple)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 40 45 L 40 23 L 46 35 L 52 23 L 52 45" fill="none" stroke="#9d4edd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Code bracket right '>' -->
    <path d="M 55 26 L 61 35 L 55 44" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <g transform="translate(88, 22)">
    <!-- AM in bold gradient -->
    <text x="0" y="32" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="1">
      <tspan fill="url(#cyanPurple)">AM</tspan>
      <tspan fill="#ffffff" dx="8">DEVELOPERS</tspan>
    </text>
    <!-- Tagline -->
    <text x="2" y="52" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="11.5" letter-spacing="3.2" fill="#94a3b8">
      WEB DEVELOPMENT AGENCY
    </text>
    <!-- Little green online pulse dot -->
    <circle cx="282" cy="49" r="4" fill="#10b981" />
  </g>
</svg>
