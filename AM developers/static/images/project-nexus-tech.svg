<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="nexusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#nexusBg)"/>
  
  <!-- Browser Chrome Header -->
  <rect width="600" height="36" rx="16" fill="#0f172a"/>
  <rect y="20" width="600" height="16" fill="#0f172a"/>
  <circle cx="24" cy="18" r="5" fill="#ef4444"/>
  <circle cx="40" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="18" r="5" fill="#10b981"/>
  <rect x="180" y="8" width="240" height="20" rx="10" fill="#1e293b"/>
  <text x="300" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">nexustechglobal.com</text>

  <!-- Nexus Banner -->
  <g transform="translate(40, 60)">
    <rect width="520" height="130" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="25" y="40" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5">ENTERPRISE CLOUD ARCHITECTURE</text>
    <text x="25" y="75" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="900">Nexus Tech Solutions</text>
    <text x="25" y="100" fill="#94a3b8" font-family="sans-serif" font-size="11">Scalable Kubernetes, Microservices &amp; High-Throughput APIs</text>
    <rect x="390" y="45" width="105" height="32" rx="6" fill="url(#cyberGrad)"/>
    <text x="442" y="65" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Case Study →</text>
  </g>

  <!-- Stats Grid -->
  <g transform="translate(40, 210)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="160" height="130" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="35" fill="#94a3b8" font-family="sans-serif" font-size="11">UPTIME SLA</text>
    <text x="20" y="75" fill="#00f2fe" font-family="sans-serif" font-size="26" font-weight="bold">99.99%</text>
    <text x="20" y="105" fill="#64748b" font-family="sans-serif" font-size="10">High Availability Cluster</text>

    <!-- Box 2 -->
    <rect x="180" y="0" width="160" height="130" rx="10" fill="#1e293b" stroke="#00f2fe" stroke-width="1.2"/>
    <text x="200" y="35" fill="#94a3b8" font-family="sans-serif" font-size="11">THROUGHPUT</text>
    <text x="200" y="75" fill="#a855f7" font-family="sans-serif" font-size="26" font-weight="bold">12M+</text>
    <text x="200" y="105" fill="#64748b" font-family="sans-serif" font-size="10">API Requests Daily</text>

    <!-- Box 3 -->
    <rect x="360" y="0" width="160" height="130" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="380" y="35" fill="#94a3b8" font-family="sans-serif" font-size="11">CLIENT TRUST</text>
    <text x="380" y="75" fill="#10b981" font-family="sans-serif" font-size="26" font-weight="bold">40+ Cos</text>
    <text x="380" y="105" fill="#64748b" font-family="sans-serif" font-size="10">Across 6 Countries</text>
  </g>
</svg>
