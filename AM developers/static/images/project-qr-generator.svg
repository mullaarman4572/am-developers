<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="qrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#qrBg)"/>
  
  <!-- Browser Chrome Header -->
  <rect width="600" height="36" rx="16" fill="#0f172a"/>
  <rect y="20" width="600" height="16" fill="#0f172a"/>
  <circle cx="24" cy="18" r="5" fill="#ef4444"/>
  <circle cx="40" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="18" r="5" fill="#10b981"/>
  <rect x="180" y="8" width="240" height="20" rx="10" fill="#1e293b"/>
  <text x="300" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">qr.amdevelopers.in</text>

  <!-- Title bar -->
  <text x="40" y="70" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900">QR Generator Suite</text>
  <rect x="235" y="55" width="85" height="20" rx="10" fill="#38bdf8" fill-opacity="0.2"/>
  <text x="277" y="69" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">WEB UTILITY</text>

  <!-- Left Form Generator Panel -->
  <g transform="translate(40, 95)">
    <rect width="270" height="250" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="30" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">Configure Your QR</text>
    
    <!-- Option Pills -->
    <rect x="20" y="45" width="65" height="22" rx="6" fill="#00f2fe"/>
    <text x="52" y="60" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">UPI Pay</text>
    
    <rect x="92" y="45" width="60" height="22" rx="6" fill="#334155"/>
    <text x="122" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">URL Link</text>
    
    <rect x="160" y="45" width="55" height="22" rx="6" fill="#334155"/>
    <text x="187" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Wi-Fi</text>

    <!-- Inputs -->
    <text x="20" y="92" fill="#94a3b8" font-family="sans-serif" font-size="10">UPI ID / VPA</text>
    <rect x="20" y="100" width="230" height="28" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="30" y="118" fill="#cbd5e1" font-family="sans-serif" font-size="10">amdevelopers@upi</text>

    <text x="20" y="148" fill="#94a3b8" font-family="sans-serif" font-size="10">Business Name</text>
    <rect x="20" y="156" width="230" height="28" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="30" y="174" fill="#cbd5e1" font-family="sans-serif" font-size="10">AM Developers Studio</text>

    <!-- Action button -->
    <rect x="20" y="200" width="230" height="32" rx="8" fill="url(#cyanPurple)"/>
    <text x="135" y="221" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Generate QR Code ⚡</text>
  </g>

  <!-- Right QR Canvas Preview -->
  <g transform="translate(335, 95)">
    <rect width="225" height="250" rx="12" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="112" y="30" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Live Preview</text>

    <!-- QR Code Graphic Container -->
    <rect x="37" y="45" width="150" height="150" rx="10" fill="#ffffff"/>
    
    <!-- QR Corner Targets -->
    <rect x="47" y="55" width="38" height="38" rx="4" fill="#0f172a"/>
    <rect x="53" y="61" width="26" height="26" rx="2" fill="#ffffff"/>
    <rect x="59" y="67" width="14" height="14" rx="2" fill="#00f2fe"/>

    <rect x="139" y="55" width="38" height="38" rx="4" fill="#0f172a"/>
    <rect x="145" y="61" width="26" height="26" rx="2" fill="#ffffff"/>
    <rect x="151" y="67" width="14" height="14" rx="2" fill="#00f2fe"/>

    <rect x="47" y="147" width="38" height="38" rx="4" fill="#0f172a"/>
    <rect x="53" y="153" width="26" height="26" rx="2" fill="#ffffff"/>
    <rect x="59" y="159" width="14" height="14" rx="2" fill="#00f2fe"/>

    <!-- QR Data Patterns -->
    <rect x="95" y="58" width="10" height="20" fill="#0f172a"/>
    <rect x="115" y="65" width="12" height="15" fill="#8b5cf6"/>
    <rect x="95" y="90" width="35" height="15" fill="#0f172a"/>
    <rect x="60" y="105" width="20" height="30" fill="#0f172a"/>
    <rect x="95" y="120" width="35" height="18" fill="#8b5cf6"/>
    <rect x="140" y="105" width="30" height="25" fill="#0f172a"/>
    <rect x="140" y="145" width="18" height="30" fill="#0f172a"/>
    <rect x="95" y="155" width="35" height="20" fill="#00f2fe"/>

    <!-- Center Logo Badge -->
    <circle cx="112" cy="120" r="14" fill="#0f172a"/>
    <text x="112" y="124" fill="#00f2fe" font-size="10" font-weight="bold" text-anchor="middle">AM</text>

    <!-- Download button -->
    <rect x="37" y="206" width="150" height="28" rx="6" fill="#10b981"/>
    <text x="112" y="224" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">⬇ Download PNG / SVG</text>
  </g>
</svg>
