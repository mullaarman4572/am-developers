<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="gymBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#gymBg)"/>
  
  <!-- Browser Chrome Header -->
  <rect width="600" height="36" rx="16" fill="#0b1120"/>
  <rect y="20" width="600" height="16" fill="#0b1120"/>
  <circle cx="24" cy="18" r="5" fill="#ef4444"/>
  <circle cx="40" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="18" r="5" fill="#10b981"/>
  <rect x="180" y="8" width="240" height="20" rx="10" fill="#1e293b"/>
  <text x="300" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">evolvefitnessclub.in</text>

  <!-- Fitness Hero Banner Inside -->
  <g transform="translate(35, 55)">
    <rect width="530" height="140" rx="12" fill="#131c2e" stroke="#1e293b"/>
    <text x="30" y="45" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" letter-spacing="2">UNLEASH YOUR POTENTIAL</text>
    <text x="30" y="80" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="900">EVOLVE FITNESS HUB</text>
    <text x="30" y="105" fill="#94a3b8" font-family="sans-serif" font-size="11">CrossFit • Strength Training • Yoga • Nutrition Plans</text>
    <rect x="30" y="115" width="130" height="28" rx="14" fill="url(#neonGreen)"/>
    <text x="95" y="133" fill="#090d16" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">Book Free Pass</text>

    <!-- Workout stats badge -->
    <g transform="translate(380, 25)">
      <rect width="120" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="60" y="32" fill="#10b981" font-family="sans-serif" font-size="22" font-weight="900" text-anchor="middle">500+</text>
      <text x="60" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Active Members</text>
      <text x="60" y="72" fill="#38bdf8" font-family="sans-serif" font-size="9" text-anchor="middle">★★★★★ 4.9</text>
    </g>
  </g>

  <!-- Membership Tiers Preview -->
  <g transform="translate(35, 215)">
    <!-- Plan 1 -->
    <rect x="0" y="0" width="165" height="140" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="18" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">MONTHLY</text>
    <text x="18" y="58" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">₹1,499</text>
    <text x="18" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="10">✓ Gym floor access</text>
    <text x="18" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="10">✓ Locker facilities</text>
    <rect x="18" y="110" width="129" height="20" rx="5" fill="#334155"/>
    <text x="82" y="124" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">Select Plan</text>

    <!-- Plan 2 (Highlighted) -->
    <rect x="182" y="0" width="165" height="140" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="245" y="0" width="102" height="18" rx="0" fill="#10b981"/>
    <text x="296" y="13" fill="#0f172a" font-family="sans-serif" font-size="8" font-weight="900" text-anchor="middle">MOST POPULAR</text>
    <text x="200" y="32" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">QUARTERLY</text>
    <text x="200" y="58" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">₹3,999</text>
    <text x="200" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="10">✓ Personal Trainer Session</text>
    <text x="200" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="10">✓ Custom Diet Plan</text>
    <rect x="200" y="110" width="129" height="20" rx="5" fill="url(#neonGreen)"/>
    <text x="264" y="124" fill="#090d16" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Join Now</text>

    <!-- Plan 3 -->
    <rect x="365" y="0" width="165" height="140" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="383" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">ANNUAL PRO</text>
    <text x="383" y="58" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">₹11,999</text>
    <text x="383" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="10">✓ All-Access Pass</text>
    <text x="383" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="10">✓ Free Steam &amp; Sauna</text>
    <rect x="383" y="110" width="129" height="20" rx="5" fill="#334155"/>
    <text x="447" y="124" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">Select Plan</text>
  </g>
</svg>
